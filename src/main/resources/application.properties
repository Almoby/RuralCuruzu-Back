spring.application.name=rural-curuzu

# MongoDB Atlas: la URI real se toma de la variable de entorno MONGODB_URI
# (configurala en IntelliJ: Run > Edit Configurations > Environment variables).
# Nunca escribas la URI real (con usuario y contraseña) directamente en este archivo.
# Propiedad propia (no la de Spring Boot): la lee MongoConfig directamente.
app.mongodb.uri=${MONGODB_URI}

# JWT: el secreto real también se toma de una variable de entorno (JWT_SECRET).
# Debe ser una cadena larga y aleatoria (mínimo 256 bits / 32 caracteres) en producción.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# "Mi QR" del socio (documento, sección 15): cuántos segundos es válido el
# token antes de que la app del socio tenga que pedir uno nuevo. Reutiliza
# jwt.secret para firmarlo, no es un secreto aparte.
qr.token-validez-segundos=${QR_TOKEN_VALIDEZ_SEGUNDOS:300}

# Logs detallados del paquete propio (busqueda de usuario, validacion de password, etc).
# En produccion conviene bajar esto a INFO.
logging.level.com.almoby.ruralcuruzu=DEBUG

# Recuperacion de contraseña: cuanto dura el enlace y a donde apunta.
# No son secretos, por eso tienen un valor por defecto y no requieren variable de entorno.
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}

# Envio de emails: "console" (solo loguea en consola) o "smtp" (envio real, default).
# Requiere MAIL_USERNAME/MAIL_PASSWORD configurados como variables de entorno.
app.email.provider=${EMAIL_PROVIDER:smtp}

# Configuracion SMTP (solo se usa si app.email.provider=smtp). El usuario y la
# contraseña son secretos reales (para Gmail, una "contraseña de aplicacion",
# no la contraseña normal de la cuenta): siempre por variable de entorno, nunca
# escritos acá.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Bloqueo de cuenta tras contraseñas incorrectas seguidas (independiente del
# campo "estado", que es un bloqueo manual del admin).
app.login.max-intentos-fallidos=${LOGIN_MAX_INTENTOS_FALLIDOS:5}
app.login.duracion-bloqueo-minutos=${LOGIN_DURACION_BLOQUEO_MINUTOS:15}

# Rate limiting: máximo de intentos de login por IP en 5 minutos, y máximo de
# solicitudes de forgot-password por email en 1 hora (para frenar spam de correos).
app.login.max-intentos-por-ip=${LOGIN_MAX_INTENTOS_POR_IP:20}
app.password-reset.max-solicitudes-por-hora=${PASSWORD_RESET_MAX_SOLICITUDES_POR_HORA:3}

# CORS: orígenes permitidos para llamar a esta API desde el navegador (separados
# por coma si hay más de uno). Cambiar cuando el frontend tenga un dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Refresh token: cuánto dura antes de que el usuario tenga que volver a
# loguearse sí o sí (a diferencia del access token, que dura poco y se
# renueva solo con este).
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}

# Solicitud de socio: máximo de solicitudes por IP en 1 hora (antispam del
# formulario público "Quiero ser socio").
app.solicitud-socio.max-por-ip=${SOLICITUD_SOCIO_MAX_POR_IP:10}

# Respuesta a observaciones de solicitud (el solicitante todavía no tiene
# cuenta, así que responde vía el link del correo): cuánto dura el enlace,
# a dónde apunta, y dónde se guarda en disco la documentación adjunta.
app.respuesta-solicitud.expiration-minutes=${RESPUESTA_SOLICITUD_EXPIRATION_MINUTES:4320}
app.frontend.responder-solicitud-url=${FRONTEND_RESPONDER_SOLICITUD_URL:http://localhost:4200/solicitudes/responder}
app.storage.solicitudes-adjuntos-dir=${SOLICITUDES_ADJUNTOS_DIR:./uploads/solicitudes-socio}

# Dónde se guarda en disco el comprobante que un socio adjunta al informar el
# pago de una cuota por transferencia (documento 10.4, RN-17: el pago es su
# propia entidad, con su propio comprobante).
app.storage.comprobantes-pago-dir=${COMPROBANTES_PAGO_DIR:./uploads/comprobantes-pago}

# Límite de tamaño para los archivos adjuntos de documentación (por archivo y
# por request completo, que puede traer varios).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}

# Integración Mercado Pago (link de pago, documento 10.4/RN-08): access token
# de la cuenta de Mercado Pago de la cooperativa (Checkout Pro). Es un secreto
# real, siempre por variable de entorno; en este sandbox de desarrollo queda
# vacío, así que el link de pago no puede probarse contra la API real hasta
# que se cargue un token válido.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# URL pública (accesible desde internet, no localhost) a la que Mercado Pago
# manda la notificación del webhook cuando cambia el estado de un pago.
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/api/pagos/mercado-pago/webhook}
# A dónde vuelve el socio en el navegador después de pagar (o intentar pagar).
# OJO: Mercado Pago exige que estas tres sean URLs públicas reales (rechaza
# "localhost" con el error "auto_return invalid. back_url.success must be
# defined"), así que el default NO puede apuntar al front local todavía. Una
# vez que el front esté desplegado con un dominio real, poné ese dominio acá
# (por variable de entorno, no hace falta tocar este archivo). Mientras tanto
# el default apunta al propio sitio de Mercado Pago solo para poder generar el
# link de pago en desarrollo sin depender de un túnel (ngrok) — Mercado Pago
# nunca llama a esta URL desde su backend, solo redirige el navegador del
# socio ahí después de pagar, así que no hace falta que sea "nuestra".
mercadopago.back-urls.success=${MERCADOPAGO_BACK_URL_SUCCESS:https://www.mercadopago.com.ar}
mercadopago.back-urls.failure=${MERCADOPAGO_BACK_URL_FAILURE:https://www.mercadopago.com.ar}
mercadopago.back-urls.pending=${MERCADOPAGO_BACK_URL_PENDING:https://www.mercadopago.com.ar}
